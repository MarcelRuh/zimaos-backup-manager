name: zimaos-backup-manager

services:
  zimaos-backup-manager:
    image: ghcr.io/marcelruh/zimaos-backup-manager:0.1.7
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "0.1.7"
    container_name: zimaos-backup-manager
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      LISTEN_ADDR: ":8787"
      DATA_DIR: /data
      TZ: Europe/Berlin
      ZIMAOS_API_BASE_URL: ${ZIMAOS_API_BASE_URL:-http://host.docker.internal}
      ZIMAOS_API_USERNAME: ${ZIMAOS_API_USERNAME:-}
      ZIMAOS_API_PASSWORD: ${ZIMAOS_API_PASSWORD:-}
      ZIMAOS_API_TOKEN: ${ZIMAOS_API_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Docker socket for compose project discovery (labels → AppData mapping)
      DOCKER_SOCK: /var/run/docker.sock
      # Host AppData path as seen in docker inspect mounts
      APPDATA_HOST_ROOT: ${APPDATA_HOST_ROOT:-/DATA/AppData}
      APPDATA_DIR: /host/appdata
      # Host CasaOS apps compose root rewritten into the container mount
      COMPOSE_HOST_ROOT: ${COMPOSE_HOST_ROOT:-/var/lib/casaos/apps}
      CASAOS_APPS_DIR: /host/casaos/apps
    volumes:
      # App-eigene Daten unter AppData (wie andere CasaOS-Apps)
      - ${APPDATA_HOST_PATH:-/DATA/AppData}/com-zimaos-backup-manager:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Writable: compose files are copied into each app's AppData folder
      - ${APPDATA_HOST_PATH:-/DATA/AppData}:/host/appdata
      # Read-only: source docker-compose.yml files
      - ${CASAOS_APPS_HOST_PATH:-/var/lib/casaos/apps}:/host/casaos/apps:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
