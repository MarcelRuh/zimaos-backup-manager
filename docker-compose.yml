name: zimaos-backup-manager

services:
  zimaos-backup-manager:
    image: ghcr.io/marcelruh/zimaos-backup-manager:0.1.6
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "0.1.6"
    container_name: zimaos-backup-manager
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      LISTEN_ADDR: ":8787"
      DATA_DIR: /data
      TZ: Europe/Berlin
      # From inside the container, localhost is the container itself.
      # host.docker.internal + host-gateway reaches the ZimaOS host API.
      ZIMAOS_API_BASE_URL: ${ZIMAOS_API_BASE_URL:-http://host.docker.internal}
      ZIMAOS_API_USERNAME: ${ZIMAOS_API_USERNAME:-}
      ZIMAOS_API_PASSWORD: ${ZIMAOS_API_PASSWORD:-}
      ZIMAOS_API_TOKEN: ${ZIMAOS_API_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Host path with CasaOS/ZimaOS app compose files (mounted below).
      CASAOS_APPS_DIR: ${CASAOS_APPS_DIR:-/host/casaos/apps}
    volumes:
      - zbm-data:/data
      # Read-only: docker-compose.yml of installed apps
      - ${CASAOS_APPS_HOST_PATH:-/var/lib/casaos/apps}:/host/casaos/apps:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  zbm-data:
