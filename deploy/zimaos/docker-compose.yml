name: zimaos-backup-manager

services:
  zimaos-backup-manager:
    image: ghcr.io/marcelruh/zimaos-backup-manager:0.1.5
    container_name: zimaos-backup-manager
    restart: unless-stopped
    ports:
      - target: 8787
        published: "8787"
        protocol: tcp
    environment:
      LISTEN_ADDR: ":8787"
      DATA_DIR: /data
      TZ: Europe/Berlin
      ZIMAOS_API_BASE_URL: http://host.docker.internal
      CASAOS_APPS_DIR: /host/casaos/apps
    volumes:
      - type: volume
        source: zbm-data
        target: /data
      - type: bind
        source: /var/lib/casaos/apps
        target: /host/casaos/apps
        read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  zbm-data:

x-casaos:
  id: com.zimaos.backup-manager
  main: zimaos-backup-manager
  index: /
  port_map: "8787"
  scheme: http
  # Full brand logo (user artwork). jsDelivr + new path to bust CasaOS cache of old teal icon.svg
  icon: https://cdn.jsdelivr.net/gh/MarcelRuh/zimaos-backup-manager@main/deploy/zimaos/app-icon.jpg?v=20261020
  title:
    en_US: ZimaOS Backup Manager
    de_DE: ZimaOS Backup Manager
  tagline:
    en_US: Manage, schedule and monitor native ZimaOS backups
    de_DE: Native ZimaOS-Backups verwalten, planen und überwachen
  description:
    en_US: |
      Web UI to discover, start, schedule and monitor existing ZimaOS backup tasks.
      Also archives CasaOS app compose files from /var/lib/casaos/apps into the app data volume.
    de_DE: |
      Weboberfläche zum Erkennen, Starten, Planen und Überwachen vorhandener ZimaOS-Backup-Tasks.
      Archiviert zusätzlich CasaOS-Compose-Dateien aus /var/lib/casaos/apps im App-Datenvolume.
  author: Silence
  developer: Silence
  category: Productivity
  architectures:
    - amd64
    - arm64
  version: "0.1.5"
  tips:
    before_install:
      en_US: |
        Ensure the container can reach the ZimaOS host API via host.docker.internal.
        The bind mount /var/lib/casaos/apps (read-only) enables compose-file backups under Settings.
        After install, open the WebUI, complete admin setup, then enter ZimaOS username/password under Settings.
      de_DE: |
        Stelle sicher, dass der Container die ZimaOS-Host-API über host.docker.internal erreicht.
        Der RO-Mount /var/lib/casaos/apps aktiviert Compose-Backups unter Einstellungen.
        Nach der Installation Admin anlegen und unter Einstellungen ZimaOS-Benutzername/Passwort hinterlegen.
  website: https://github.com/MarcelRuh/zimaos-backup-manager
  repo: https://github.com/MarcelRuh/zimaos-backup-manager
  support: https://github.com/MarcelRuh/zimaos-backup-manager/issues
  docs: https://github.com/MarcelRuh/zimaos-backup-manager/blob/main/README.md
