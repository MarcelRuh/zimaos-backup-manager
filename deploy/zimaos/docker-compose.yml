name: zimaos-backup-manager

services:
  zimaos-backup-manager:
    image: ghcr.io/marcelruh/zimaos-backup-manager:0.1.12
    container_name: zimaos-backup-manager
    restart: unless-stopped
    ports:
      - target: 8787
        published: "8787"
        protocol: tcp
    environment:
      LISTEN_ADDR: ":8787"
      DATA_DIR: /data
      TZ: $TZ
      ZIMAOS_API_BASE_URL: http://host.docker.internal
      DOCKER_SOCK: /var/run/docker.sock
      # Adjust APPDATA_HOST_ROOT if your AppData lives elsewhere (e.g. /media/SSD-Storage/AppData)
      APPDATA_HOST_ROOT: /DATA/AppData
      APPDATA_DIR: /host/appdata
      COMPOSE_HOST_ROOT: /var/lib/casaos/apps
      CASAOS_APPS_DIR: /host/casaos/apps
    volumes:
      # CasaOS ersetzt $AppID (wie bei anderen Store-Apps)
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: bind
        source: /DATA/AppData
        target: /host/appdata
      - type: bind
        source: /var/lib/casaos/apps
        target: /host/casaos/apps
        read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"

x-casaos:
  id: com.zimaos.backup-manager
  main: zimaos-backup-manager
  index: /
  port_map: "8787"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/MarcelRuh/zimaos-backup-manager@main/deploy/zimaos/app-icon.jpg?v=20261020
  title:
    en_US: ZimaOS Backup Manager
    de_DE: ZimaOS Backup Manager
  tagline:
    en_US: Manage, schedule and monitor native ZimaOS backups
    de_DE: Native ZimaOS-Backups verwalten, planen und überwachen
  description:
    en_US: |
      Web UI to discover, start, schedule and monitor existing ZimaOS backup tasks.
      After a successful ZimaOS backup, copies each app's docker-compose.yml into its AppData folder.
    de_DE: |
      Weboberfläche zum Erkennen, Starten, Planen und Überwachen vorhandener ZimaOS-Backup-Tasks.
      Nach erfolgreichem ZimaOS-Backup: Compose-Dateien per Docker-Erkennung in die AppData-Ordner legen.
  author: Silence
  developer: Silence
  category: Productivity
  architectures:
    - amd64
    - arm64
  version: "0.1.12"
  tips:
    before_install:
      en_US: |
        Needs Docker socket, AppData (RW) and /var/lib/casaos/apps (RO) mounts.
        Set APPDATA_HOST_ROOT to your real AppData path if it is not /DATA/AppData.
        After install: admin setup, ZimaOS login under Settings, enable "Compose after success" per backup task.
      de_DE: |
        Benötigt Docker-Socket, AppData (RW) und /var/lib/casaos/apps (RO).
        APPDATA_HOST_ROOT anpassen, falls AppData nicht unter /DATA/AppData liegt.
        Nach Installation: Admin anlegen, ZimaOS-Login, pro Task „Compose nach Erfolg“ aktivieren.
  website: https://github.com/MarcelRuh/zimaos-backup-manager
  repo: https://github.com/MarcelRuh/zimaos-backup-manager
  support: https://github.com/MarcelRuh/zimaos-backup-manager/issues
  docs: https://github.com/MarcelRuh/zimaos-backup-manager/blob/main/README.md
